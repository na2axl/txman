info:
  name: List transactions
  type: http
  seq: 1
  tags:
    - Transactions

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query
    - name: search
      value: ""
      type: query
      disabled: true
    - name: status
      value: PENDING
      type: query
      disabled: true
    - name: status
      value: APPROVED
      type: query
      disabled: true
    - name: status
      value: REJECTED
      type: query
      disabled: true
    - name: customer_id
      value: ""
      type: query
      disabled: true
    - name: sort_by
      value: created_at
      type: query
    - name: sort_by
      value: updated_at
      type: query
      disabled: true
    - name: sort_by
      value: amount
      type: query
      disabled: true
    - name: sort_by
      value: reference
      type: query
      disabled: true
    - name: sort_by
      value: status
      type: query
      disabled: true
    - name: order
      value: asc
      type: query
      disabled: true
    - name: order
      value: desc
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

