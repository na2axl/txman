info:
  name: Change the status of a transaction
  type: http
  seq: 4
  tags:
    - Transactions

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/transactions/:id/status"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "status": "PENDING"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: The transaction with its new status
    request:
      url: "{{baseUrl}}/api/v1/transactions/:id/status"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "status": "PENDING"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "reference": "",
            "customer": {
              "id": "",
              "name": ""
            },
            "amount": 0,
            "currency": "",
            "status": "PENDING",
            "allowed_transitions": [
