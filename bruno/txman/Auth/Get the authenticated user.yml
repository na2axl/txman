info:
  name: Get the authenticated user
  type: http
  seq: 2
  tags:
    - Auth

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: The authenticated user
    request:
      url: "{{baseUrl}}/api/v1/auth/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "username": ""
          }
  - name: 401 Response
    description: Missing, invalid or expired bearer token
    request:
      url: "{{baseUrl}}/api/v1/auth/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "request_id": "",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ]
          }
