name: ejara-txman
services:
  postgres:
    image: postgres:17-alpine
    container_name: ejara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ejara}
      POSTGRES_USER: ${POSTGRES_USER:-ejara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ejara}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ejara}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  redis:
    image: redis:8-alpine
    container_name: ejara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: ejara-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: 3000
      APP_NAME: "Transaction Manager"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-ejara}
      DATABASE_USER: ${POSTGRES_USER:-ejara}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ejara}
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
      - public

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: ejara-frontend
    restart: unless-stopped
    ports:
      - "5173:3000"
    depends_on:
      - backend
    networks:
      - public

volumes:
  postgres_data:
  redis_data:

networks:
  private:
    driver: bridge
  public:
    driver: bridge
